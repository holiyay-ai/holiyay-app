version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: holiyay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: holiyay
      POSTGRES_PASSWORD: holiyay
      POSTGRES_DB: holiyay
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U holiyay" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
